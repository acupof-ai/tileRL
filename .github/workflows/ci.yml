# CI gate policy: only deterministic checks block the build.
#   - ruff lint + format (rule set and day-1 ignores: pyproject.toml [tool.ruff])
#   - hermetic CPU pytest: TILERL_TARGET=cpu, GPU/Metal tests auto-skip, so
#     plain `uv run pytest` on CI is exactly the deterministic set.
# No bench/perf steps — non-deterministic, never gate on them.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # tilelang 0.1.13 ships wheels for both — this is the cross-platform evidence.
        runs-on: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        # Non-blocking until the tree is reformatted: 80 of 251 files still
        # differ, and a sweep that touches them all is a worse risk than an
        # unformatted tree. CLAUDE.md has said this since day 1; the workflow
        # just never implemented it, so main has been red on it since 2026-08-28.
        continue-on-error: true
        run: uv run ruff format --check
      - name: CPU test suite
        run: uv run pytest -v
        env:
          TILERL_TARGET: cpu
      - name: Distributed gates (gloo, world=2)
        # These drive mp.spawn and own their own pass/fail, so they define no
        # test_ function and `pytest` collects ZERO items from them -- measured.
        # Until this step existed they ran only when someone typed them, which
        # is the same as not having them. Each exits non-zero on failure.
        run: |
          set -e
          ran=0
          for gate in tests/tp_world2.py tests/ce_sharded_world2.py tests/mesh_world4.py tests/dp_world4.py; do
            [ -f "$gate" ] || continue
            echo "== $gate"
            uv run python3 "$gate"
            ran=$((ran + 1))
          done
          # A rename would otherwise skip every gate and pass: the step must fail
          # when it ran nothing, not report success for doing nothing.
          [ "$ran" -gt 0 ] || { echo "no distributed gate ran -- renamed?" >&2; exit 1; }
          echo "distributed gates run: $ran"
        env:
          TILERL_TARGET: cpu
      - name: Both distributions build
        # The workspace ships two wheels; a release that cannot build one of
        # them is found at publish time otherwise.
        run: |
          uv build --package tilerl-kernels
          uv build --package tilerl
