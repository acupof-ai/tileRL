<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilerl</title>
<style>
  /* Warm paper, one terracotta accent, no pure white and no saturated blue.
     Both schemes are defined token-only: every rule below reads a var, so the
     dark block redefines colours and nothing else. */
  :root {
    color-scheme: light dark;
    --paper: #faf9f7; --card: #fffdfa; --sunk: #f1eee8; --line: #e5e0d8;
    --fg: #1f1e1c; --dim: #6d6a63; --accent: #bd5d3a; --accent-ink: #fdfcfa;
    --user: #f2ece3; --warn: #8a6a2f;
    --s1: 6px; --s2: 12px; --s3: 18px; --s4: 28px;
    --wide: 720px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #21201c; --card: #292824; --sunk: #2f2e29; --line: #3b3934;
      --fg: #e9e7e2; --dim: #a29e95; --accent: #d97757; --accent-ink: #1b1a17;
      --user: #34312a; --warn: #d2a760;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line);
  }
  header .inner { display: flex; align-items: center; gap: var(--s3);
    max-width: var(--wide); width: 100%; margin: 0 auto; }
  /* Serif on the wordmark only -- the one place it reads as voice rather than
     as a second body font competing with the reply. */
  header .brand { font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 19px; letter-spacing: -.2px; color: var(--fg); }
  header label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: var(--s1); }
  header input[type=number] { width: 68px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; font: inherit; font-size: 13px; }
  header a { margin-left: auto; color: var(--accent); font-size: 13px; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  #log { flex: 1; overflow-y: auto; padding: var(--s4) var(--s3); display: flex;
         flex-direction: column; gap: var(--s4); max-width: var(--wide); width: 100%; margin: 0 auto; }
  .turn { display: flex; flex-direction: column; gap: var(--s2); }
  .turn.user .answer {
    align-self: flex-end; background: var(--user); border: 1px solid var(--line);
    padding: var(--s2) var(--s3); border-radius: 12px; max-width: 76%;
  }
  /* The assistant speaks on the paper itself; only the user's turn is a card.
     A border on both made the page read as a form rather than a conversation. */
  .turn.assistant .answer:empty { display: none; }
  details.reasoning { background: var(--sunk); border: 1px solid var(--line);
    border-radius: 12px; padding: var(--s1) var(--s2); }
  details.reasoning summary { color: var(--dim); font-size: 13px; cursor: pointer;
    list-style: none; }
  details.reasoning summary::before { content: "▸ "; }
  details.reasoning[open] summary::before { content: "▾ "; }
  details.reasoning summary::-webkit-details-marker { display: none; }
  .reasoning-body { color: var(--dim); font-size: 14px; white-space: pre-wrap;
    margin-top: var(--s1); }
  .note { color: var(--warn); font-size: 13px; }
  .prose { white-space: pre-wrap; margin: 0 0 var(--s2); }
  .prose:last-child { margin-bottom: 0; }
  /* Headings sit close to the text they introduce and lighter than a document's
     would -- this is a reply, not a page. */
  .answer h1, .answer h2, .answer h3,
  .answer h4, .answer h5, .answer h6 {
    font-weight: 600; line-height: 1.3; margin: var(--s3) 0 var(--s1);
  }
  .answer h1 { font-size: 21px; } .answer h2 { font-size: 18px; }
  .answer h3 { font-size: 16px; }
  .answer h4, .answer h5, .answer h6 { font-size: 15px; color: var(--dim); }
  .answer > :first-child { margin-top: 0; }
  .answer ul, .answer ol { margin: 0 0 var(--s2); padding-left: var(--s4); }
  .answer li { margin: 2px 0; }
  .answer a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px;
        padding: var(--s2) var(--s3); overflow-x: auto; margin: var(--s2) 0; position: relative; }
  /* Shown on hover AND on keyboard focus: hover-only hides it from a keyboard,
     focus-only hides it from a mouse. */
  pre .copy {
    position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 12px;
    background: var(--card); color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; opacity: 0; transition: opacity .12s; font-weight: 400;
  }
  pre:hover .copy, pre .copy:focus-visible { opacity: 1; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; }
  .prose code, .answer li code { background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
  .pending .answer::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    /* The caret still marks the pending turn; only the motion goes. */
    .pending .answer::after { animation: none; }
    pre .copy { transition: none; }
  }
  footer { border-top: 1px solid var(--line); padding: var(--s3); }
  .composer { display: flex; gap: var(--s2); max-width: var(--wide); margin: 0 auto; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px;
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; padding: var(--s2) var(--s3); font: inherit;
  }
  textarea::placeholder { color: var(--dim); }
  textarea:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 0 var(--s4); font: inherit; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  /* The stop button replaces Send while a turn streams, so it takes the quiet
     treatment: ending a reply is not the page's primary action. */
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  #meter { color: var(--dim); font-size: 12px; text-align: center;
           max-width: var(--wide); margin: var(--s2) auto 0; font-variant-numeric: tabular-nums; }
</style>

</head>
<body>
<header>
  <div class="inner">
    <span class="brand">tilerl</span>
    <label><input type="checkbox" id="thinking" checked> thinking</label>
    <label>budget <input type="number" id="budget" placeholder="auto" min="1" step="64"></label>
    <a href="/about">about</a>
  </div>
</header>
<div id="log"></div>
<footer>
  <div class="composer">
    <textarea id="composer" placeholder="Ask the model…" autofocus></textarea>
    <button id="send">Send</button>
    <button id="stop" class="ghost" hidden>Stop</button>
  </div>
  <div id="meter"></div>
</footer>
