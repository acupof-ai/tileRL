<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilerl</title>
<style>
  /* Same tokens as the landing page in ui_assets.py, so the two pages stay one
     product rather than two that happen to share a host. */
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e8eb; --dim: #8b93a1; --accent: #7aa2f7; --accent2: #9ece6a;
    --warn: #e0af68;
    --s1: 6px; --s2: 12px; --s3: 18px; --s4: 28px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.6 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  header {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 800; color: var(--accent); letter-spacing: -.3px; }
  header label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: var(--s1); }
  header input[type=number] { width: 72px; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 13px; }
  header a { margin-left: auto; color: var(--accent); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: var(--s4) var(--s3); display: flex;
         flex-direction: column; gap: var(--s3); max-width: 860px; width: 100%; margin: 0 auto; }
  .turn { display: flex; flex-direction: column; gap: var(--s2); }
  .turn.user .answer {
    align-self: flex-end; background: var(--accent); color: #0f1115;
    padding: var(--s2) var(--s3); border-radius: 12px; max-width: 76%;
  }
  .turn.assistant .answer { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: var(--s2) var(--s3); }
  .turn.assistant .answer:empty { display: none; }
  details.reasoning { background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: var(--s1) var(--s2); }
  details.reasoning summary { color: var(--dim); font-size: 13px; cursor: pointer; }
  .reasoning-body { color: var(--dim); font-size: 14px; white-space: pre-wrap;
    margin-top: var(--s1); }
  .note { color: var(--warn); font-size: 13px; }
  .prose { white-space: pre-wrap; }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
        padding: var(--s2); overflow-x: auto; margin: var(--s1) 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .prose code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .pending .answer::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    /* The caret still marks the pending turn; only the motion goes. */
    .pending .answer::after { animation: none; }
  }
  footer { border-top: 1px solid var(--line); padding: var(--s2) var(--s3); }
  .composer { display: flex; gap: var(--s2); max-width: 860px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 180px;
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: var(--s2); font: inherit;
  }
  button {
    background: var(--accent); color: #0f1115; border: 0; border-radius: 10px;
    padding: 0 var(--s4); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #meter { color: var(--dim); font-size: 12px; text-align: center;
           max-width: 860px; margin: var(--s1) auto 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <span class="brand">tilerl</span>
  <label><input type="checkbox" id="thinking" checked> thinking</label>
  <label>budget <input type="number" id="budget" value="512" min="1" step="64"></label>
  <a href="/about">about</a>
</header>
<div id="log"></div>
<footer>
  <div class="composer">
    <textarea id="composer" placeholder="Ask the model…" autofocus></textarea>
    <button id="send">Send</button>
  </div>
  <div id="meter"></div>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
